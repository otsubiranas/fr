<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qui est-ce ? Le grand détective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2A5A;--cream:#FFF7E8;--red:#E63946;--blue:#2D6CDF;--green:#21A366;--yellow:#FFB703;--muted:#5F6890}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--cream) radial-gradient(circle at 1px 1px,rgba(30,42,90,.07) 1px,transparent 0) 0 0/22px 22px;overflow:hidden;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none}
button:disabled{cursor:default}

/* ---------- barre du haut ---------- */
.topbar{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--ink);color:#fff}
.logo{background:none;color:#fff;font-family:Fredoka;font-size:23px;font-weight:700;display:flex;gap:10px;align-items:center;white-space:nowrap}
.flag{display:inline-flex;width:30px;height:20px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.flag i{flex:1}
#scores{flex:1;display:flex;justify-content:center;gap:12px}
.chip{display:flex;align-items:center;gap:7px;background:var(--tc);box-shadow:0 3px 0 rgba(0,0,0,.25);border-radius:999px;padding:4px 6px 4px 12px;font-weight:900;font-size:18px;border:3px solid transparent;transition:.25s;white-space:nowrap}
.chip.turn{border-color:#fff;transform:scale(1.08);box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.chip .nm{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.chip .pts{min-width:46px;text-align:center;font-family:Fredoka;font-size:25px;line-height:32px;background:#fff;color:var(--ink);border-radius:999px;padding:0 10px}
.chip .pm{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:17px;font-weight:900;line-height:1}
.chip.bump .pts{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.5);background:var(--yellow)}}
.tools{display:flex;gap:8px}
.tbtn{background:rgba(255,255,255,.13);color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:900;white-space:nowrap}
.tbtn.off{opacity:.45}
#app{height:calc(100vh - 64px);padding:16px 22px;display:flex;flex-direction:column;gap:14px;overflow:auto}

/* ---------- boutons ---------- */
.btn{background:var(--ink);color:#fff;font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.3vh,27px);padding:.55em 1.15em;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(30,42,90,.2)}
.btn.sm{font-size:clamp(15px,1.9vh,21px);padding:.45em .9em}
.btn.big{font-size:clamp(24px,3.6vh,40px)}
.btn:disabled{opacity:.6}
.btn.pulse{animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.actions{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.actions.sm{gap:8px}
.link{background:none;color:var(--muted);font-weight:900;font-size:inherit;text-decoration:underline}

/* ---------- accueil ---------- */
.home{max-width:1400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:2.2vh;align-items:center;justify-content:center;min-height:100%}
.herochars{display:flex;gap:12px;justify-content:center}
.cc.mini{height:17vh;cursor:default}
.cc.mini:hover{transform:none}
.hero{text-align:center}
.hero h1{font-size:clamp(42px,8vh,96px);margin:0;line-height:1}
.hero h1 span{display:block;font-size:.48em;color:var(--red);margin-top:.15em}
.hero p{font-size:clamp(18px,2.7vh,30px);margin:.35em 0 0;color:var(--muted);font-weight:900}
.setup{display:flex;gap:14px;align-items:center;background:#fff;border-radius:999px;padding:8px 18px 8px 24px;font-weight:900;font-size:clamp(16px,2.3vh,25px);box-shadow:0 4px 0 rgba(30,42,90,.12)}
.names{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:900;font-size:clamp(16px,2.3vh,25px)}
.tname{background:var(--tc);color:#fff;border:3px solid transparent;border-radius:999px;padding:.35em .9em;font-family:Fredoka;font-weight:600;font-size:clamp(17px,2.4vh,26px);width:11em;text-align:center;outline:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tname:focus{border-color:var(--ink)}
.tname::placeholder{color:rgba(255,255,255,.7)}
.seg{display:flex;background:#EEF1FA;border-radius:999px;padding:4px}
.seg button{background:none;font-family:Fredoka;font-size:1.05em;font-weight:700;color:var(--ink);width:2.2em;height:1.7em;border-radius:999px}
.seg button.on{background:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;width:100%}
.mcard{background:#fff;border-radius:22px;padding:16px 12px;text-align:center;box-shadow:0 6px 0 var(--mc);border:3px solid var(--mc);cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.mcard:hover{transform:translateY(-5px)}
.num{width:42px;height:42px;border-radius:50%;background:var(--mc);color:#fff;font-family:Fredoka;font-weight:700;font-size:24px;display:grid;place-items:center}
.num.big{width:70px;height:70px;font-size:40px}
.mcard .em{font-size:clamp(34px,6vh,64px);line-height:1.1}
.mcard h3{margin:0;font-size:clamp(18px,2.6vh,30px);line-height:1.1}
.mcard p{margin:0;color:var(--muted);font-weight:800;font-size:clamp(13px,1.8vh,19px)}
.stars{color:var(--yellow);font-size:clamp(15px,2.2vh,24px);letter-spacing:2px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.stars.big{font-size:clamp(26px,4vh,44px)}

/* ---------- intro / fin ---------- */
.intro{max-width:1100px;margin:auto;text-align:center;display:flex;flex-direction:column;gap:2.2vh;align-items:center}
.intro h2{font-size:clamp(38px,7vh,82px);margin:0;line-height:1.05}
.intro .sub{font-size:clamp(20px,3vh,32px);font-weight:900;color:var(--muted);margin:0}
.intro ol{text-align:left;font-size:clamp(20px,3.1vh,34px);font-weight:800;line-height:1.45;background:#fff;border-radius:24px;padding:22px 40px 22px 72px;margin:0;box-shadow:0 5px 0 rgba(30,42,90,.12)}
.intro ol li{margin:.15em 0}
.em.huge{font-size:clamp(60px,11vh,120px);line-height:1}
.podium{display:flex;gap:28px;align-items:flex-end;justify-content:center;height:30vh;width:100%}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:170px}
.pbar{width:100%;border-radius:16px 16px 0 0;color:#fff;font-family:Fredoka;font-weight:700;font-size:clamp(28px,5vh,56px);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;animation:grow .8s ease-out}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.pn{font-weight:900;font-size:clamp(17px,2.4vh,26px);margin-top:8px}

/* ---------- jeu : éléments communs ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(15px,2vh,23px);box-shadow:0 3px 0 rgba(30,42,90,.12);white-space:nowrap}
.badge.lvl{background:var(--yellow)}
.say{flex:1;min-width:300px;display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:.4em .8em;font-family:Fredoka;font-weight:600;font-size:clamp(24px,4.4vh,52px);line-height:1.15;box-shadow:0 5px 0 rgba(30,42,90,.12);border:3px solid var(--ink)}
.say .txt{flex:1}
.spk{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--blue);color:#fff;font-size:.75em;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.gwrap{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.gallery{width:min(100cqw,calc(100cqh*1.92));display:grid;grid-template-columns:repeat(6,1fr);gap:min(1.6cqh,14px)}
.cc{position:relative;aspect-ratio:2/3;background:linear-gradient(#D6ECFF,#F2F8FF);border-radius:16px;border:4px solid #fff;box-shadow:0 4px 0 rgba(30,42,90,.14);cursor:pointer;overflow:hidden;transition:transform .25s,opacity .35s,filter .35s,box-shadow .25s}
.cc svg{display:block;width:100%;height:100%}
.cc:hover{transform:translateY(-3px)}
.cc.out{opacity:.2;filter:grayscale(1);transform:scale(.93)}
.cc.wrong{opacity:.4;filter:grayscale(.85);animation:shake .45s}
.cc.wrong::after,.cc.right::after{position:absolute;top:6px;right:6px;width:1.6em;height:1.6em;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(16px,2.6vh,30px)}
.cc.wrong::after{content:'✗';background:var(--red)}
.cc.right{border-color:var(--green);box-shadow:0 0 0 6px rgba(33,163,102,.45),0 10px 24px rgba(0,0,0,.2);transform:scale(1.05);z-index:2;opacity:1;filter:none}
.cc.right::after{content:'✓';background:var(--green)}
.cc.big{cursor:default}.cc.big:hover{transform:none}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- vrai ou faux ---------- */
.vf,.det{flex:1;min-height:0;display:flex;gap:3vw}
.bigwrap{flex:0 0 34%;container-type:size;display:flex;align-items:center;justify-content:center}
.bigwrap .cc{width:min(100cqw,calc(100cqh*.6667))}
.vfright{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3vh;min-width:0}
.rules2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rule{border-radius:22px;padding:14px;text-align:center;font-family:Fredoka;font-weight:600;font-size:clamp(20px,3.2vh,36px);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:.3s}
.rule .em{font-size:2em;display:block;line-height:1.1}
.rule.t{background:var(--green)}.rule.f{background:var(--red)}
.rule.dim{opacity:.2;transform:scale(.92)}
.res{min-height:14vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stamp{font-family:Fredoka;font-weight:700;font-size:clamp(54px,11vh,130px);line-height:1;transform:rotate(-6deg);animation:stamp .45s}
.stamp.t{color:var(--green)}.stamp.f{color:var(--red)}
.corr{text-align:center;font-size:clamp(20px,3.2vh,36px);font-weight:900;background:#fff;border-radius:16px;padding:6px 18px}
@keyframes stamp{0%{transform:scale(.2) rotate(-25deg);opacity:0}70%{transform:scale(1.15) rotate(-4deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- quatre coins ---------- */
.timer{height:10px;background:rgba(30,42,90,.1);border-radius:9px;overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:var(--yellow);border-radius:9px}
.four{width:min(100cqw,calc(100cqh*2.3));display:grid;grid-template-columns:repeat(4,1fr);gap:min(3cqh,26px)}
.cc.corner{display:flex;flex-direction:column;aspect-ratio:2/3.35;border-width:8px;border-color:var(--k)}
.cc.corner svg{flex:1;min-height:0}
.ctag{background:var(--k);color:#fff;font-family:Fredoka;font-weight:700;text-align:center;font-size:clamp(18px,3.4cqh,38px);padding:2px 0 5px;letter-spacing:1px}
.who{font-weight:900;font-size:clamp(19px,2.6vh,30px)}

/* ---------- détective ---------- */
.detright{flex:1;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;min-width:0;padding:4px}
.turnb{border-radius:18px;padding:10px 12px 10px 20px;color:#fff;font-family:Fredoka;font-weight:600;font-size:clamp(22px,3.4vh,40px);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .3s;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.turnb.sm{font-size:clamp(18px,2.5vh,28px);padding:8px 16px}
.turnb .left{font-size:.75em;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 12px;white-space:nowrap}
.hint{margin:0;font-weight:900;font-size:clamp(17px,2.4vh,27px);color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fcard{min-height:clamp(80px,14vh,150px);border-radius:18px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Fredoka;font-weight:600;font-size:clamp(17px,2.5vh,29px);text-align:center;padding:10px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;line-height:1.15}
.fcard:hover{filter:brightness(1.08)}
.fcard .fi{font-size:1.5em;line-height:1}
.fcard.open{background:#fff;color:var(--ink);border:4px solid var(--green);animation:flip .45s;cursor:default;filter:none}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ---------- personnage mystère ---------- */
.mys{flex:1;min-height:0;display:flex;gap:18px}
.panel{width:clamp(330px,31vw,500px);flex:none;background:#fff;border-radius:22px;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 rgba(30,42,90,.12)}
.qa{background:var(--cream);border-radius:16px;padding:10px;text-align:center;min-height:clamp(90px,15vh,160px);display:flex;flex-direction:column;justify-content:center;gap:2px}
.qa .q{font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.7vh,30px)}
.qa .q.muted{color:var(--muted)}
.qa .a{font-family:Fredoka;font-weight:700;font-size:clamp(36px,6.4vh,70px);line-height:1;animation:popin .35s}
.qa .a.yes{color:var(--green)}.qa .a.no{color:var(--red)}
.qa .as{font-weight:900;font-size:clamp(15px,2.1vh,23px)}
.qh{font-weight:900;color:var(--muted);font-size:clamp(13px,1.8vh,19px);margin-bottom:4px}
.qb{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{background:#EEF2FF;color:var(--ink);border-radius:10px;padding:.3em .65em;font-weight:900;font-size:clamp(14px,2vh,21px);border:2px solid #D5DCF5}
.qbtn:hover:not(:disabled){background:#DCE4FF}
.qbtn.y{background:#D8F5E5;border-color:var(--green);color:#11603A}
.qbtn.n{background:#FDE0E2;border-color:var(--red);color:#8A1C25}
.chk{font-weight:900;font-size:clamp(14px,1.9vh,19px);display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:20px;height:20px}
.gallery.guessing .cc:not(.out){animation:glow .7s infinite alternate;cursor:crosshair}
@keyframes glow{to{box-shadow:0 0 0 6px var(--yellow)}}

/* ---------- modale, toast, confettis ---------- */
#overlay{position:fixed;inset:0;background:rgba(20,26,56,.55);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.show{display:flex}
.modal{background:var(--cream);border-radius:28px;padding:26px 32px;max-width:min(1100px,94vw);max-height:92vh;overflow:auto;text-align:center;animation:popin .3s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:94vw;max-width:1500px}
.modal h2{font-size:clamp(34px,6vh,70px);margin:0 0 .2em}
.mp{font-weight:900;font-size:clamp(18px,2.7vh,30px);margin:.2em 0 .8em}
.secret{display:flex;align-items:center;gap:24px;justify-content:center;margin-bottom:16px;text-align:left}
.secret .cc{height:34vh;cursor:default}
.secret .mp{max-width:540px}
.vtop{display:flex;justify-content:space-between;align-items:center}
.vh{font-size:clamp(22px,3.4vh,36px);margin:18px 0 10px;text-align:left;color:var(--red)}
.vgrid{display:flex;flex-wrap:wrap;gap:16px}
.vitem{width:clamp(110px,10vw,165px);text-align:center;cursor:pointer}
.vitem .cc{width:100%}
.cc.sq{aspect-ratio:1}
.vcap{font-weight:900;font-size:clamp(14px,1.9vh,20px);margin-top:6px;line-height:1.2}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,250%);opacity:0;background:var(--ink);color:#fff;font-family:Fredoka;font-weight:600;font-size:clamp(22px,3.4vh,38px);padding:12px 28px;border-radius:18px;transition:transform .3s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0);opacity:1}
.vfright .say{flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{top:105vh;transform:rotate(800deg) translateX(60px)}}
</style>
</head>
<body>
<header class="topbar">
  <button class="logo" onclick="goHome()"><span class="flag"><i style="background:#0055A4"></i><i style="background:#fff"></i><i style="background:#EF4135"></i></span>Qui est-ce ?</button>
  <div id="scores"></div>
  <div class="tools">
    <button class="tbtn" id="bVoice" onclick="toggleVoice()">🔊 Voix</button>
    <button class="tbtn" id="bSound" onclick="toggleSound()">🎵 Sons</button>
    <button class="tbtn" onclick="vocab()">📖 Vocabulaire</button>
    <button class="tbtn" onclick="toggleFull()" title="Plein écran">⛶</button>
  </div>
</header>
<main id="app"></main>
<div id="overlay"></div>
<div id="toast"></div>

<script>
/* =================== OUTILS =================== */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let UID=0;
const S={nt:2,scores:[0,0,0],voice:true,sound:true,turn:-1};
let M=null;
const TEAMS=[{n:'Les Rouges',c:'#E63946'},{n:'Les Bleus',c:'#2D6CDF'},{n:'Les Verts',c:'#21A366'}];
const CC=[{n:'ROUGE',c:'#E63946'},{n:'BLEU',c:'#2D6CDF'},{n:'VERT',c:'#21A366'},{n:'JAUNE',c:'#F2A900'}];

/* =================== VOCABULAIRE =================== */
const HCOLS=['blonds','bruns','blancs','roux','noirs'],HYOUNG=['blonds','bruns','roux','noirs'],TEX=['bouclés','raides','frisés'],EYES=['bleus','verts','marron','noirs'],HAIR=['hc','hl','ht'];
const HC={blonds:'#F4CC4A',bruns:'#7A4A26',blancs:'#F5F5F5',roux:'#DE6A2C',noirs:'#2A2522'};
const HD={blonds:'#C9981E',bruns:'#4B2A12',blancs:'#A8A8A8',roux:'#A8441A',noirs:'#000'};
const EC={bleus:'#2F80ED',verts:'#27A85B',marron:'#7B4A22',noirs:'#141414'};
const SKIN=[['#FFE1C9','#E2B08C'],['#F7CBA6','#D49C72'],['#E5AE80','#BF8456'],['#C78A5C','#9E683F'],['#9C6542','#77492B'],['#71462A','#52321C']];
const CLOTH=['#E63946','#2D6CDF','#2BB673','#FFB703','#8E5BD8','#FF7AA2','#14B8A6','#F97316'];
const PANTS=['#2B3A67','#3D3D3D','#5B4636','#264653','#6D597A'];

function norm(c){
  if(c.g==='f'){c.beard=false;c.mous=false;c.bald=false}
  if(c.g==='m')c.hl='courts';
  if(!c.hc)c.hc=pick(HYOUNG);if(!c.hl)c.hl='courts';c.ht='raides';
  if(!c.old&&c.hc==='blancs')c.hc=pick(HYOUNG);
  return c}
function randChar(o={}){
  const g=o.g||(Math.random()<.5?'m':'f');
  const old=o.old!==undefined?o.old:Math.random()<.33;
  const c={id:++UID,g,old,tall:Math.random()<.5,eyes:pick(EYES),glasses:Math.random()<.33,beard:false,mous:false,bald:false,
    skin:Math.floor(Math.random()*SKIN.length),cloth:pick(CLOTH),cloth2:pick(PANTS)};
  if(g==='m'){c.bald=Math.random()<(old?.35:.14);c.beard=Math.random()<.3;c.mous=Math.random()<.3}
  c.hc=old&&Math.random()<.55?'blancs':pick(HYOUNG);
  c.hl=g==='f'&&Math.random()<.7?'longs':'courts';
  Object.assign(c,o);return norm(c)}
function facts(c){const f=[];
  if(c.bald)f.push('bald');else f.push('hc:'+c.hc,'hl:'+c.hl);
  f.push('eyes:'+c.eyes,'h:'+(c.tall?'grand':'petit'),'a:'+(c.old?'vieux':'jeune'));
  if(c.beard)f.push('beard');if(c.mous)f.push('mous');if(c.glasses)f.push('glasses');return f}
const sub=f=>f.split(':')[0];
function has(c,f){if(f==='g:m')return c.g==='m';if(f==='g:f')return c.g==='f';return facts(c).includes(f)}
const sig=c=>c.g+'|'+facts(c).sort().join(',');

/* =================== GRAMMAIRE =================== */
const ADJ={grand:['grand','grande'],petit:['petit','petite'],jeune:['jeune','jeune'],vieux:['vieux','vieille']};
const ORDER=['h','a','bald','hc','hl','ht','eyes','beard','mous','glasses'];
const joinEt=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' et '+a[a.length-1];
const P=g=>g==='f'?'Elle':'Il';
function sentence(g,fs){const gi=g==='f'?1:0;fs=fs.slice().sort((x,y)=>ORDER.indexOf(sub(x))-ORDER.indexOf(sub(y)));
  const est=[],a=[],hair=[];
  for(const f of fs){const[k,v]=f.split(':');
    if(k==='bald')est.push('chauve');else if(k==='h'||k==='a')est.push(ADJ[v][gi]);
    else if(HAIR.includes(k))hair.push(v);else if(k==='eyes')a.push('les yeux '+v);
    else if(k==='beard')a.push('une barbe');else if(k==='mous')a.push('une moustache');else if(k==='glasses')a.push('des lunettes')}
  if(hair.length)a.unshift('les cheveux '+joinEt(hair));
  const out=[];if(est.length)out.push(`${P(g)} est ${joinEt(est)}.`);if(a.length)out.push(`${P(g)} a ${joinEt(a)}.`);return out.join(' ')}
function neg(g,f){const p=P(g),gi=g==='f'?1:0,[k,v]=f.split(':');
  if(k==='g')return v==='m'?"Ce n'est pas un homme.":"Ce n'est pas une femme.";
  if(k==='bald')return `${p} n'est pas chauve.`;
  if(k==='h'||k==='a')return `${p} n'est pas ${ADJ[v][gi]}.`;
  if(HAIR.includes(k))return `${p} n'a pas les cheveux ${v}.`;
  if(k==='eyes')return `${p} n'a pas les yeux ${v}.`;
  return `${p} n'a pas de ${({beard:'barbe',mous:'moustache',glasses:'lunettes'})[k]}.`}
function pos(g,f){if(f==='g:m')return "C'est un homme.";if(f==='g:f')return "C'est une femme.";return sentence(g,[f])}
function qtext(f){const[k,v]=f.split(':');
  if(k==='g')return v==='m'?"C'est un homme ?":"C'est une femme ?";
  if(k==='bald')return 'Il est chauve ?';
  if(k==='h')return v==='grand'?'Il/Elle est grand(e) ?':'Il/Elle est petit(e) ?';
  if(k==='a')return v==='jeune'?'Il/Elle est jeune ?':'Il/Elle est vieux/vieille ?';
  if(HAIR.includes(k))return `Il/Elle a les cheveux ${v} ?`;
  if(k==='eyes')return `Il/Elle a les yeux ${v} ?`;
  if(k==='beard')return 'Il a une barbe ?';if(k==='mous')return 'Il a une moustache ?';
  return 'Il/Elle a des lunettes ?'}

/* =================== GÉNÉRATION DES MANCHES =================== */
function combos(a,k){const r=[];(function go(s,cur){if(cur.length===k){r.push(cur.slice());return}for(let i=s;i<a.length;i++){cur.push(a[i]);go(i+1,cur);cur.pop()}})(0,[]);return r}
const isUnique=(t,pool,set)=>pool.every(o=>o===t||o.g!==t.g||!set.every(f=>has(o,f)));
function findDesc(t,pool,k){const F=facts(t);k=Math.min(k,F.length);
  const sizes=[];for(let s=k;s>=1;s--)sizes.push(s);for(let s=k+1;s<=F.length;s++)sizes.push(s);
  for(const s of sizes){
    const mins=combos(F,s).filter(cb=>isUnique(t,pool,cb)&&(s===1||combos(cb,s-1).every(x=>!isUnique(t,pool,x))));
    if(mins.length){const d=pick(mins).slice();const rest=shuffle(F.filter(f=>!d.includes(f)));while(d.length<k&&rest.length)d.push(rest.pop());return d}}
  return null}
function mutate(b){const c={...b,id:++UID,cloth:pick(CLOTH),cloth2:pick(PANTS)};
  const ops=['eyes','h','a'];if(!c.bald)ops.push('hc','hl','hc');if(c.g==='m')ops.push('bald');
  if(c.glasses)ops.push('gl');if(c.beard)ops.push('be');if(c.mous)ops.push('mo');
  switch(pick(ops)){
    case 'eyes':c.eyes=pick(EYES.filter(x=>x!==c.eyes));break;case 'h':c.tall=!c.tall;break;case 'a':c.old=!c.old;break;
    case 'hc':c.hc=pick(HCOLS.filter(x=>x!==c.hc&&(c.old||x!=='blancs')));break;
    case 'hl':c.hl=c.hl==='longs'?'courts':'longs';break;case 'ht':c.ht=pick(TEX.filter(x=>x!==c.ht));break;
    case 'bald':c.bald=!c.bald;break;case 'gl':c.glasses=false;break;case 'be':c.beard=false;break;case 'mo':c.mous=false;break}
  return norm(c)}
function buildSet(n,nv,k){let last=null;
  for(let tr=0;tr<400;tr++){const v0=tr>200?Math.max(0,nv-2):nv;
    const t=randChar(),set=[t],sg=new Set([sig(t)]);let g=0;
    while(set.length<1+v0&&g++<200){const v=mutate(Math.random()<.65?t:pick(set));if(!sg.has(sig(v))){sg.add(sig(v));set.push(v)}}
    g=0;while(set.length<n&&g++<500){const r=randChar();if(!sg.has(sig(r))){sg.add(sig(r));set.push(r)}}
    if(set.length<n)continue;const d=findDesc(t,set,k);if(!d)continue;
    last={t,set:shuffle(set),d};break}
  return last}
function falseFact(c){const g={};const add=(k,v)=>{(g[k]=g[k]||[]).push(v)};
  HCOLS.forEach(x=>{if(c.bald||x!==c.hc)add('hc','hc:'+x)});
  if(c.bald){add('hl','hl:longs');add('hl','hl:courts')}else add('hl','hl:'+(c.hl==='longs'?'courts':'longs'));
  if(c.g==='m'&&!c.bald)add('bald','bald');
  EYES.forEach(x=>{if(x!==c.eyes)add('eyes','eyes:'+x)});
  add('h','h:'+(c.tall?'petit':'grand'));add('a','a:'+(c.old?'jeune':'vieux'));
  if(!c.glasses)add('gl','glasses');if(c.g==='m'){if(!c.beard)add('be','beard');if(!c.mous)add('mo','mous')}
  return pick(g[pick(Object.keys(g))])}
function correction(c,ff){const s=sub(ff);const t=facts(c).find(f=>sub(f)===s);
  if(t)return sentence(c.g,[t]);if(c.bald&&HAIR.includes(s))return sentence(c.g,['bald']);return neg(c.g,ff)}

function zig(cx,cy,rx,ry,n,amp){let p='';for(let i=0;i<n;i++){const a=Math.PI*2*i/n,k=i%2?1-amp:1;p+=(i?'L':'M')+(cx+Math.cos(a)*rx*k).toFixed(1)+','+(cy+Math.sin(a)*ry*k).toFixed(1)}return p+'Z'}
function curl(x,y,rr,hf,hd){return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="${hf}" stroke="${hd}" stroke-width="1.5"/><path d="M${(x-3).toFixed(1)},${(y+1).toFixed(1)} a3,3 0 1,1 3,3" fill="none" stroke="${hd}" stroke-width="1.3"/>`}
function backHair(c,cx,hy,r,hf,hd){const st=`fill="${hf}" stroke="${hd}" stroke-width="1.5" stroke-linejoin="round"`,L=c.hl==='longs';
  if(c.ht==='frisés')return L?`<path d="${zig(cx,hy+12,r+21,r+38,64,.09)}" ${st}/>`:`<path d="${zig(cx,hy-5,r+10,r+6,48,.11)}" ${st}/>`;
  if(!L)return '';
  if(c.ht==='raides')return `<path d="M${cx-r-5},${hy-2} A${r+5} ${r+5} 0 0 1 ${cx+r+5},${hy-2} L${cx+r+9},${hy+62} Q${cx},${hy+70} ${cx-r-9},${hy+62} Z" ${st}/><path d="M${cx-r-1},${hy+22} l-4,38 M${cx+r+1},${hy+22} l4,38" stroke="${hd}" stroke-width="1.2" opacity=".6"/>`;
  let s=`<path d="M${cx-r-4},${hy} A${r+4} ${r+4} 0 0 1 ${cx+r+4},${hy} L${cx+r+5},${hy+54} L${cx-r-5},${hy+54} Z" fill="${hf}"/>`;
  for(const sd of[-1,1])for(let i=0;i<6;i++)s+=curl(cx+sd*(r+4+(i%2?3:0)),hy-2+i*11.5,8.5,hf,hd);
  return s}
function frontHair(c,cx,hy,r,hf,hd){const st=`fill="${hf}" stroke="${hd}" stroke-width="1.5" stroke-linejoin="round"`;
  if(c.ht==='raides')return `<path d="M${cx-r-2},${hy+6} C${cx-r-5},${hy-r-19} ${cx+r+5},${hy-r-19} ${cx+r+2},${hy+6} L${cx+r-4},${hy+6} L${cx+r-6},${hy-14} L${cx-r+6},${hy-14} L${cx-r+4},${hy+6} Z" ${st}/><path d="M${cx-12},${hy-14} l-1,-9 M${cx-4},${hy-14} l0,-11 M${cx+4},${hy-14} l0,-11 M${cx+12},${hy-14} l1,-9" stroke="${hd}" stroke-width="1.2" opacity=".7"/>`;
  if(c.ht==='bouclés'){let s=`<path d="M${cx-r},${hy+2} C${cx-r-3},${hy-r-14} ${cx+r+3},${hy-r-14} ${cx+r},${hy+2} Q${cx+r-6},${hy-16} ${cx},${hy-17} Q${cx-r+6},${hy-16} ${cx-r},${hy+2} Z" fill="${hf}"/>`;
    for(let k=0;k<9;k++){const a=(196+k*18.5)*Math.PI/180;s+=curl(cx+Math.cos(a)*(r+1),hy-3+Math.sin(a)*(r+1),8,hf,hd)}
    for(const dx of[-13,-4,5,14])s+=curl(cx+dx,hy-19+(Math.abs(dx)>10?2:0),6.5,hf,hd);
    return s}
  let pts='';const n=10;for(let i=0;i<=n;i++){const x=cx+r-8-i*(2*r-16)/n,y=hy-16+(i%2?5:0);pts+=` L${x.toFixed(1)},${y}`}
  return `<path d="M${cx-r-2},${hy+4} C${cx-r-6},${hy-r-22} ${cx+r+6},${hy-r-22} ${cx+r+2},${hy+4} L${cx+r-4},${hy+4} L${cx+r-7},${hy-11}${pts} L${cx-r+7},${hy-11} L${cx-r+4},${hy+4} Z" ${st}/>`}
function drawChar(c,o={}){
  const cx=80,r=27,hy=c.tall?58:112,G=232,[sk,sd]=SKIN[c.skin];
  const tt=hy+r+3,th=c.tall?72:46,hip=tt+th;

  const bf=c.bald?(c.old?'#EDEDED':'#5A3418'):hf,bd=c.bald?(c.old?'#A9A9A9':'#2B170A'):hd;
  const vb=o.crop==='face'?`${cx-44} ${hy-46} 88 88`:o.crop==='eyes'?`${cx-26} ${hy-24} 52 52`:'0 0 160 240';

  if(c.g==='m')s+=`<rect x="${cx-19}" y="${lt}" width="17" height="${lb-lt}" rx="6" fill="${c.cloth2}"/><rect x="${cx+2}" y="${lt}" width="17" height="${lb-lt}" rx="6" fill="${c.cloth2}"/>`;
  else s+=`<rect x="${cx-15}" y="${lt}" width="10" height="${lb-lt}" rx="5" fill="${sk}"/><rect x="${cx+5}" y="${lt}" width="10" height="${lb-lt}" rx="5" fill="${sk}"/>`;
  s+=`<ellipse cx="${cx-12}" cy="${G-5}" rx="12" ry="5.5" fill="#3A3330"/><ellipse cx="${cx+12}" cy="${G-5}" rx="12" ry="5.5" fill="#3A3330"/>`;
  const ay=tt+9,hY=tt+th*.82;

  if(c.old)s+=`<path d="M${cx+36},${G-3} L${cx+33},${hY-5} q-1,-9 -9,-8" stroke="#7A4B25" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;

  else{const db=hip+(G-hip)*.45;s+=`<path d="M${cx-15},${tt} L${cx+15},${tt} Q${cx+21},${tt} ${cx+21},${tt+7} L${cx+34},${db} Q${cx},${db+7} ${cx-34},${db} L${cx-21},${tt+7} Q${cx-21},${tt} ${cx-15},${tt} Z" fill="${c.cloth}"/><path d="M${cx-8},${tt} Q${cx},${tt+9} ${cx+8},${tt}" fill="#fff" opacity=".8"/>`}
  s+=`<rect x="${cx-7}" y="${hy+r-9}" width="14" height="14" rx="3" fill="${sd}"/>`;

  s+=`<circle cx="${cx}" cy="${hy}" r="${r}" fill="${sk}" stroke="${sd}" stroke-width="1.5"/>`;
  if(c.bald)s+=`<ellipse cx="${cx-9}" cy="${hy-17}" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-20 ${cx-9} ${hy-17})"/>`;
  if(!c.old)s+=`<circle cx="${cx-16}" cy="${hy+10}" r="4.5" fill="#FF7B7B" opacity=".3"/><circle cx="${cx+16}" cy="${hy+10}" r="4.5" fill="#FF7B7B" opacity=".3"/>`;
  else s+=`<path d="M${cx-19},${hy-2} l-4,-2 M${cx-19},${hy+2} l-5,0 M${cx-19},${hy+5} l-4,2 M${cx+19},${hy-2} l4,-2 M${cx+19},${hy+2} l5,0 M${cx+19},${hy+5} l4,2 M${cx-11},${hy+8} q-4,5 -1,10 M${cx+11},${hy+8} q4,5 1,10 M${cx-8},${hy-18} q8,-3 16,0 M${cx-6},${hy-22} q6,-2 12,0" stroke="${sd}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  const ec=EC[c.eyes];

/* ---- 1. Vrai ou faux ---- */
function VF(){const m={round:0,total:10};
  m.next=function(){if(m.round>=m.total)return endGame(0);
    const k=m.round<3?1:m.round<6?2:3,c=randChar(),truth=Math.random()<.5,F=facts(c);let fs,ff=null;
    if(truth)fs=shuffle(F).slice(0,k);
    else{ff=falseFact(c);let pool=F.filter(f=>sub(f)!==sub(ff));if(ff==='bald')pool=pool.filter(f=>!HAIR.includes(sub(f)));if(HAIR.includes(sub(ff)))pool=pool.filter(f=>f!=='bald');fs=shuffle(pool).slice(0,k-1).concat([ff])}
    Object.assign(m,{c,truth,ff,k,text:sentence(c.g,fs),rev:false});m.round++;
    app(`<div class="bar">${badge('Phrase '+m.round+' / '+m.total)}${lvlBadge(k,3)}</div>
    <div class="vf"><div class="bigwrap"><div class="cc big">${drawChar(c)}</div></div>
    <div class="vfright"><div class="say"><span class="txt">« ${m.text} »</span>${spk()}</div>
    <div class="rules2"><div class="rule t" id="rt"><span class="em">🙋</span>VRAI ? Levez-vous !</div><div class="rule f" id="rf"><span class="em">🪑</span>FAUX ? Restez assis !</div></div>
    <div class="res" id="res"></div>
    <div class="actions" id="act"><button class="btn yellow" onclick="M.reveal()">Révéler la réponse</button></div></div></div>`);
    speak(m.text)};
  m.reveal=function(){if(m.rev)return;m.rev=true;beep(m.truth?'ok':'no');$(m.truth?'#rf':'#rt').classList.add('dim');
    const corr=m.truth?'':correction(m.c,m.ff);
    $('#res').innerHTML=`<div class="stamp ${m.truth?'t':'f'}">${m.truth?'VRAI !':'FAUX !'}</div>`+(m.truth?'':`<div class="corr">En réalité : ${corr}</div>`);
    if(m.truth)confetti(40);
    $('#act').innerHTML=`<button class="btn" onclick="M.next()">${nextLbl(m)} ➜</button>`;
    speak(m.truth?"C'est vrai !":"C'est faux ! "+corr)};
  return m}

    app(`<div class="bar">${badge('Manche '+m.round+' / '+m.total)}${lvlBadge(lvl,3)}<div class="say"><span class="txt">« ${m.text} »</span>${spk()}</div></div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="gwrap"><div class="four">${m.set.map((c,i)=>`<div class="cc corner" style="--k:${CC[i].c}" data-i="${i}" onclick="M.tap(${i})"><div class="ctag">${CC[i].n}</div>${drawChar(c)}</div>`).join('')}</div></div>
    <div class="actions" id="act"><button class="btn yellow" onclick="M.reveal()">Révéler la réponse</button></div>`);
    speak(m.text);
    const b=$('#tbar');void b.offsetWidth;b.style.transition='width 20s linear';b.style.width='0%';
    m.tm=setTimeout(()=>{if(!m.rev){toast('⏰ Temps écoulé !');beep('pt')}},20000)};
  m.tap=()=>m.reveal();
  m.reveal=function(){if(m.rev)return;m.rev=true;clearTimeout(m.tm);const b=$('#tbar');if(b){b.style.transition='none';b.style.width=getComputedStyle(b).width}
    const ti=m.set.indexOf(m.t);document.querySelectorAll('.four .cc').forEach((el,i)=>el.classList.add(i===ti?'right':'out'));beep('ok');
    $('#act').innerHTML=`<span class="who">C'est le <b style="color:${CC[ti].c}">${CC[ti].n}</b> ! Qui a trouvé ?</span>${TEAMS.slice(0,S.nt).map((t,i)=>`<button class="btn sm" style="background:${t.c}" onclick="M.give(${i},this)">+1 ${t.n}</button>`).join('')}<button class="btn" onclick="M.next()">${nextLbl(m)} ➜</button>`;
    speak("C'est le "+CC[ti].n.toLowerCase()+' !')};
  m.give=(i,b)=>{if(m.given.has(i))return;m.given.add(i);addPts(i,1);b.disabled=true;b.textContent='✓ '+TEAMS[i].n};
  return m}

      setTimeout(()=>modal(`<h2>Bravo ! 🎉</h2><p class="mp">Quelle équipe a trouvé ?</p><div class="actions">${TEAMS.slice(0,S.nt).map((t,j)=>`<button class="btn big" style="background:${t.c}" onclick="M.award(${j})">${t.n}</button>`).join('')}<button class="btn light" onclick="M.award(-1)">Personne</button></div>`),700)}
    else if(!el.classList.contains('wrong')){el.classList.add('wrong');beep('no');toast('Non ! Écoutez encore… 👂')}};
  m.reveal=function(){if(m.done)return;m.done=true;m.set.forEach((c,i)=>cardEl(i).classList.add(c===m.t?'right':'out'));m.after()};
  m.award=function(j){closeModal();if(j>=0)addPts(j,1);m.set.forEach((c,i)=>{if(c!==m.t)cardEl(i).classList.add('out')});m.after()};
  m.showText=()=>{const t=$('#qtxt');if(t){t.textContent='« '+m.text+' »';t.style.color='';t.removeAttribute('id')}const b=$('#qshow');if(b)b.remove()};
  m.after=()=>{m.showText();$('#act').innerHTML=`<button class="btn" onclick="M.next()">${nextLbl(m)} ➜</button>`};

const ICON={hc:'💇',hl:'💇',ht:'💇',bald:'💇',eyes:'👁️',h:'📏',a:'🎂',beard:'🧔',mous:'🧔',glasses:'👓'};
const LBL={hc:'Les cheveux : la couleur',hl:'Les cheveux : longs ou courts ?',ht:'Les cheveux : la forme',bald:'Les cheveux ?',eyes:'Les yeux',h:'Grand ou petit ?',a:'Jeune ou vieux ?',beard:'Le visage',mous:'Le visage',glasses:'Un accessoire'};
function DET(){const m={round:0,total:6};
  const fc=j=>{const f=m.F[j];return m.open.has(j)?`<div class="fcard open" id="fc${j}">${sentence(m.c.g,[f])}</div>`:`<div class="fcard" id="fc${j}" onclick="M.flip(${j})"><span class="fi">${m.hints?ICON[sub(f)]:'❓'}</span><span>${m.hints?LBL[sub(f)]:'?'}</span></div>`};
  m.next=function(){if(m.round>=m.total)return endGame(3);let c;do{c=randChar()}while(facts(c).length<5);
    Object.assign(m,{c,F:shuffle(facts(c)),open:new Set(),hints:m.round<2});m.round++;if(S.turn<0)S.turn=0;renderScores();const t=TEAMS[S.turn];
    app(`<div class="bar">${badge('Personnage '+m.round+' / '+m.total)}${lvlBadge(m.hints?1:2,2)}${badge(m.hints?'Avec indices 💡':'Sans indices !')}</div>
    <div class="det"><div class="bigwrap"><div class="cc big">${drawChar(c)}</div></div>
    <div class="detright"><div class="turnb" id="turnb" style="background:${t.c}"><span>C'est le tour de : <b>${t.n}</b></span><button class="btn light sm" onclick="M.nextTeam()">Équipe suivante ➜</button></div>
    <p class="hint">🗣️ Décrivez le personnage ! Une phrase correcte = 1 point.</p>
    <div class="fgrid">${m.F.map((f,j)=>fc(j)).join('')}</div>
    <div class="actions"><button class="btn light" onclick="M.all()">Tout révéler</button><button class="btn" onclick="M.next()">${m.round>=m.total?'Voir le résultat':'Personnage suivant'} ➜</button></div></div></div>`)};
  m.flip=function(j){if(m.open.has(j))return;m.open.add(j);addPts(S.turn,1);beep('ok');$('#fc'+j).outerHTML=fc(j);speak(sentence(m.c.g,[m.F[j]]));
    if(m.open.size===m.F.length){confetti();toast('Bravo ! Tout est trouvé ! 🎉')}};
  m.nextTeam=function(){passTurn();const t=TEAMS[S.turn],b=$('#turnb');b.style.background=t.c;b.querySelector('b').textContent=t.n};
  m.all=function(){m.F.forEach((f,j)=>{if(!m.open.has(j)){m.open.add(j);$('#fc'+j).outerHTML=fc(j)}})};
  return m}

const QG=[["C'est…",[['g:m','un homme'],['g:f','une femme']]],
 ['Il/Elle a les cheveux…',[...HCOLS.map(x=>['hc:'+x,x]),['hl:longs','longs'],['hl:courts','courts']]],
 ['Il/Elle est…',[['bald','chauve'],['h:grand','grand(e)'],['h:petit','petit(e)'],['a:jeune','jeune'],['a:vieux','vieux/vieille']]],
 ['Il/Elle a les yeux…',EYES.map(x=>['eyes:'+x,x])],
 ['Il/Elle a…',[['beard','une barbe'],['mous','une moustache'],['glasses','des lunettes']]]];
function MYS(){const m={auto:true};
  m.next=function(){closeModal();const r=buildSet(12,4,1);Object.assign(m,{set:r.set,secret:pick(r.set),out:new Set(),asked:new Map(),guess:false,done:false,last:null});
    if(S.turn<0)S.turn=0;renderScores();
    app(`<div class="mys"><div class="gwrap"><div class="gallery" id="gal">${m.set.map((c,i)=>card(c,i)).join('')}</div></div><div class="panel" id="panel"></div></div>`);m.panel()};
  m.panel=function(){const t=TEAMS[S.turn],left=m.set.length-m.out.size,L=m.last;
    $('#panel').innerHTML=`<div class="turnb sm" style="background:${t.c}"><span>À vous : <b>${t.n}</b></span><span class="left">${left} personne${left>1?'s':''}</span></div>
    <div class="qa">${L?`<div class="q">« ${qtext(L.f)} »</div><div class="a ${L.yes?'yes':'no'}">${L.yes?'OUI !':'NON !'}</div>${L.s?`<div class="as">${L.s}</div>`:''}`:`<div class="q muted">Posez une question ! 🤔</div>`}</div>
    ${QG.map(([h,items])=>`<div class="qg"><div class="qh">${h}</div><div class="qb">${items.map(([f,l])=>{const a=m.asked.get(f);return `<button class="qbtn ${a===undefined?'':a?'y':'n'}" ${a!==undefined||m.done?'disabled':''} onclick="M.ask('${f}')">${l}${a===undefined?'':a?' ✓':' ✗'}</button>`}).join('')}</div></div>`).join('')}
    <div class="actions sm"><button class="btn ${m.guess?'yellow pulse':'red'}" ${m.done?'disabled':''} onclick="M.toggleGuess()">${m.guess?'👆 Touchez la personne…':'🔍 Je devine !'}</button></div>
    <div class="actions sm"><label class="chk"><input type="checkbox" ${m.auto?'checked':''} onchange="M.auto=this.checked"> Élimination automatique</label></div>
    <div class="actions sm"><button class="btn light sm" onclick="M.reveal()">Révéler</button><button class="btn light sm" onclick="M.next()">Nouvelle partie</button></div>`};
  m.refresh=function(){m.set.forEach((c,i)=>cardEl(i).classList.toggle('out',m.out.has(i)&&!cardEl(i).classList.contains('wrong')));m.panel()};
  m.ask=function(f){if(m.done||m.asked.has(f))return;const yes=has(m.secret,f);m.asked.set(f,yes);m.guess=false;$('#gal').classList.remove('guessing');
    if(m.auto)m.set.forEach((c,i)=>{if(!m.out.has(i)&&has(c,f)!==yes)m.out.add(i)});
    const rem=m.set.filter((c,i)=>!m.out.has(i));
    const gk=m.asked.has('g:m')||m.asked.has('g:f')||(rem.length>0&&rem.every(c=>c.g===m.secret.g));
    const s=gk?(yes?pos(m.secret.g,f):neg(m.secret.g,f)):'';
    m.last={f,yes,s};beep(yes?'ok':'no');speak((yes?'Oui ! ':'Non ! ')+s);passTurn();m.refresh()};
  m.toggleGuess=function(){if(m.done)return;m.guess=!m.guess;$('#gal').classList.toggle('guessing',m.guess);m.panel()};
  m.tap=function(i){if(m.done)return;
    if(m.guess){m.guess=false;$('#gal').classList.remove('guessing');
      if(m.set[i]===m.secret)return m.win(i);
      m.out.add(i);cardEl(i).classList.add('wrong');beep('no');toast("Non ! Ce n'est pas cette personne.");speak("Non ! Ce n'est pas cette personne.");passTurn();m.refresh()}
    else{if(m.out.has(i)){m.out.delete(i);cardEl(i).classList.remove('wrong')}else m.out.add(i);m.refresh()}};
  const box=()=>`<div class="secret"><div class="cc">${drawChar(m.secret)}</div><p class="mp">${sentence(m.secret.g,facts(m.secret))}</p></div>`;
  m.show=function(i){m.done=true;m.set.forEach((c,j)=>{const el=cardEl(j);el.classList.remove('wrong');el.classList.toggle('out',j!==i);if(j===i)el.classList.add('right')});m.panel()};
  m.win=function(i){const t=TEAMS[S.turn];addPts(S.turn,3);m.show(i);confetti();speak('Bravo ! '+sentence(m.secret.g,facts(m.secret)));
    setTimeout(()=>modal(`<h2>Bravo, ${t.n} ! 🎉</h2><p class="mp">+3 points ! C'était la personne mystère :</p>${box()}<div class="actions"><button class="btn green" onclick="M.next()">Nouvelle partie</button><button class="btn light" onclick="closeModal()">Fermer</button></div>`),800)};
  m.reveal=function(){if(m.done)return;const i=m.set.indexOf(m.secret);m.show(i);speak("C'était cette personne ! "+sentence(m.secret.g,facts(m.secret)));
    modal(`<h2>La personne mystère 🤫</h2>${box()}<div class="actions"><button class="btn green" onclick="M.next()">Nouvelle partie</button><button class="btn light" onclick="closeModal()">Fermer</button></div>`)};
  return m}

/* =================== VOCABULAIRE (référence) =================== */
let VOC=[];
function withFact(f,g){const[k,v]=f.split(':');const o={glasses:false,beard:false,mous:false,bald:false};if(g)o.g=g;
  if(k==='hc'){o.hc=v;o.old=v==='blancs'}if(k==='hl'){o.hl=v;o.ht='raides';if(v==='longs')o.g='f'}if(k==='ht')o.ht=v;
  if(k==='bald'){o.bald=true;o.g='m'}if(k==='eyes')o.eyes=v;if(k==='h'){o.tall=v==='grand';o.old=false}
  if(k==='a'){o.old=v==='vieux';if(o.old)o.hc='blancs'}
  if(k==='beard'){o.beard=true;o.g='m'}if(k==='mous'){o.mous=true;o.g='m'}if(k==='glasses')o.glasses=true;
  return randChar(o)}
function vocab(){VOC=[];
